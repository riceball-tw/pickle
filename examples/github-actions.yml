# Backport hotfixes from trunk onto a release branch.
#
# Put this at .github/workflows/backport.yml and set RELEASE_BRANCH below.

name: backport to release

on:
  schedule:
    - cron: '0 2 * * *'          # nightly
  push:
    branches: [main]             # or immediately on every merge to trunk
  workflow_dispatch:
    inputs:
      release_branch:
        description: release branch to sync
        required: false

permissions:
  contents: write                # pickle pushes straight to the release branch

env:
  RELEASE_BRANCH: ${{ github.event.inputs.release_branch || 'release/1.2' }}

jobs:
  backport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required. The default (depth 1) makes cherry-pick impossible.
          # pickle will deepen a shallow clone itself, but doing it here is
          # faster and clearer.
          fetch-depth: 0

      # Exits 1 when something conflicts, which fails the job on purpose:
      # a red build is how the team finds out a fix needs backporting by hand.
      - uses: riceball-tw/pickle@v1
        with:
          target: ${{ env.RELEASE_BRANCH }}
          from: main

      # Other things you might want:
      #
      #   types: fix,perf              pick perf commits too
      #   include: '^\[HOTFIX\]'       a non-conventional-commit convention
      #   args: --keep-going           land what applies, report the rest
      #   command: status              preview only, never write

  # If release/* is a protected branch the push is rejected. Either grant this
  # workflow's identity an exception, or preview only and let a human land it:
  #
  #   - uses: riceball-tw/pickle@v1
  #     with:
  #       command: status
  #       target: ${{ env.RELEASE_BRANCH }}
