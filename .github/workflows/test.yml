name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: versions
        run: |
          bash --version | head -1
          git --version

      # Pinned deliberately. Different shellcheck versions emit different
      # advisories, so installing whatever the runner image happens to ship
      # turns an image bump into a CI failure with no code change behind it.
      - name: shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/sc"
          SC="$RUNNER_TEMP/sc/shellcheck"
          "$SC" --version
          "$SC" pickle
          "$SC" -e SC1090,SC1091 test/run.sh test/cases/*.sh

      - name: tests
        run: ./test/run.sh

  # Proves the action wrapper itself works, not just the script: builds a
  # throwaway repo in the workspace root, then runs the action against it
  # exactly as a user would.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: .pickle-src

      - name: build a fixture repo in the workspace root
        run: |
          set -euo pipefail
          git config --global user.email ci@example.com
          git config --global user.name CI
          git init -q -b main .
          echo '.pickle-src/' > .gitignore
          echo base > app.txt
          git add app.txt .gitignore && git commit -qm "chore: initial"
          git branch release/1.2
          echo one   > a.txt && git add a.txt && git commit -qm "fix(DS-1): one"
          echo two   > b.txt && git add b.txt && git commit -qm "feat(DS-2): two"
          echo three > c.txt && git add c.txt && git commit -qm "fix(DS-3): three"

      - name: run the action
        uses: ./.pickle-src
        with:
          command: status
          target: release/1.2
          from: main
